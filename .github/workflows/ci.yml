# CI: static analysis, tests, release build. Required for branch protection.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: static, test, release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev cppcheck lcov

      - name: Static analysis (cppcheck)
        run: make static

      - name: Build and test
        run: make clean && make test
        env:
          CI: true

      - name: AddressSanitizer + UBSan
        run: |
          make clean
          CFLAGS="-std=c11 -Wall -Wextra -Werror -g -O0 -fsanitize=address,undefined -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=address,undefined" \
          make test

      - name: Release build
        run: make clean && make release

      - name: Binary size check (< 2 MB)
        run: |
          size=$(stat -c%s build/shellclaw)
          if [ "$size" -gt 2097152 ]; then
            echo "Binary size $size bytes exceeds 2 MB limit"
            exit 1
          fi
          echo "Binary size: $size bytes (OK)"

      - name: Coverage (core modules >= 80%)
        run: make coverage

      - name: ASAP compliance check
        # Pin: asap-compliance >= 1.0.0 (https://pypi.org/project/asap-compliance/)
        # Requires Python 3.10+. Gracefully skips if package not yet published.
        run: |
          pip install --quiet 'asap-compliance>=1.0.0' 2>/dev/null \
            && asap-compliance --config tests/fixtures/ci_asap_test.toml build/shellclaw \
            || echo "asap-compliance unavailable or skipped (non-blocking until v0.3.0 release)"
